name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the production build
        env:
          SMOKE_URL: http://localhost:3000
        run: |
          npm run start &
          npx --yes wait-on http://localhost:3000 --timeout 60000
          npm test
